<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PSPtool</title>
<link rel="stylesheet" href="app.css">
</head>
<body class="login">
<form id="f" class="loginbox">
  <div class="brand">
    <svg class="mark" viewBox="0 0 22 22" aria-hidden="true"><rect x="1" y="5" width="20" height="12" rx="6" fill="none" stroke="#ef8a32" stroke-width="1.6"/><rect x="6.5" y="8" width="9" height="6" rx="1" fill="#ef8a32"/></svg>
    <span>PSPtool</span>
  </div>
  <input id="pw" type="password" placeholder="Пароль" autocomplete="current-password" autofocus>
  <button class="btn primary">Войти</button>
  <div id="msg" class="status err"></div>
</form>
<script>
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const msg = document.getElementById("msg");
  msg.textContent = "";
  const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ password: document.getElementById("pw").value }) });
  if (r.ok) location.href = "/";
  else msg.textContent = (await r.json().catch(() => ({}))).error || "Ошибка";
});
</script>
</body>
</html>
