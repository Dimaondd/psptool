# Builds the desktop app for macOS (Apple Silicon) and Windows. A tag
# v1.2.3 (the same as psptool.__version__) puts both in a draft release;
# packaging/release.py then signs them on the maintainer's computer and
# publishes it (the app installs only signed updates). A manual run only
# keeps them as workflow artifacts.
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# third-party actions are pinned to commits (a moved tag cannot change
# what builds a release); only the release job may write
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Dependencies
        # exact versions: a new upstream release cannot slip into ours
        run: python -m pip install pillow==11.3.0 pywebview==6.2.1 imageio-ffmpeg==0.6.0 anthropic==0.125.0 pyinstaller==6.22.3

      - name: Version
        # the tag must name the version the app reports, or its update check
        # would offer this release forever
        shell: bash
        run: |
          v=$(python -c "import psptool; print(psptool.__version__)")
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            [[ "${GITHUB_REF_NAME#v}" == "$v" ]] || { echo "tag $GITHUB_REF_NAME != psptool.__version__ $v"; exit 1; }
          else
            v="$v-dev"
          fi
          echo "PSPTOOL_VERSION=$v" >> "$GITHUB_ENV"

      - name: Native helpers, fonts, icon
        run: |
          python -m psptool.core.native
          python packaging/fetch_fonts.py
          python packaging/icon.py

      - name: Build
        run: pyinstaller packaging/psptool.spec --noconfirm

      - name: Self-test and package (macOS)
        if: runner.os == 'macOS'
        run: |
          dist/PSPtool.app/Contents/MacOS/PSPtool --selftest
          mkdir dmg && cp -R dist/PSPtool.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname PSPtool -srcfolder dmg -ov -format UDZO "PSPtool-$PSPTOOL_VERSION-macos-arm64.dmg"

      - name: Self-test and package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process dist/PSPtool/PSPtool.exe -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "selftest failed: $($p.ExitCode)" }
          Compress-Archive -Path dist/PSPtool -DestinationPath "PSPtool-$env:PSPTOOL_VERSION-windows-x64.zip"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: psptool-${{ runner.os }}
          path: |
            *.dmg
            *.zip

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          files: |
            *.dmg
            *.zip
          generate_release_notes: true
          draft: true   # published by packaging/release.py with the signatures
